      freelancerDataUpdatedAt ? ('Golden Rolodex last synced: ' + new Date(freelancerDataUpdatedAt).toLocaleString()) : 'Golden Rolodex: not synced yet',
      el('br', {}, []),
      capacityDataUpdatedAt ? ('Team Capacity last synced: ' + new Date(capacityDataUpdatedAt).toLocaleString()) : 'Team Capacity: not synced yet'
    ]);
    syncWrap.appendChild(syncStatusEl);

    function runManualSync(fnName, label, btn){
      var originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Syncing…';
      fetch('/.netlify/functions/' + fnName, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + clerkToken }
      }).then(function(res){ return res.json(); }).then(function(data){
        btn.disabled = false;
        btn.textContent = originalText;
        if(data.error){
          showToast(label + ' sync failed: ' + data.error);
          return;
        }
        showToast(label + ' synced — ' + data.synced + ' records updated.');
        if(fnName === 'sync-monday') fetchFreelancerData(function(){ render(); });
        else fetchCapacityData(function(){ render(); });
      }).catch(function(err){
        btn.disabled = false;
        btn.textContent = originalText;
        showToast(label + ' sync failed — check the console for details.');
      });
    }

    var syncMondayBtn = el('button', {class:'btn btn-primary'}, ['Sync Golden Rolodex Now']);
    syncMondayBtn.addEventListener('click', function(){ runManualSync('sync-monday', 'Golden Rolodex', syncMondayBtn); });
    var syncCapacityBtn = el('button', {class:'btn btn-primary', style:'margin-left:10px;'}, ['Sync Team Capacity Now']);
    syncCapacityBtn.addEventListener('click', function(){ runManualSync('sync-capacity', 'Team Capacity', syncCapacityBtn); });
    syncWrap.appendChild(syncMondayBtn);
    syncWrap.appendChild(syncCapacityBtn);
    wrap.appendChild(syncWrap);

    // Quick send
    var quickWrap = el('div', {class:'panel', style:'margin-bottom:28px;'});
    quickWrap.appendChild(el('div', {style:'font-weight:700; margin-bottom:10px;'}, ['Quick Send']));
    var picked = null;
    var searchBox = el('input', {placeholder:'Type a freelancer name…', style:'width:100%; margin-bottom:10px;'});
    var resultsBox = el('div', {style:'max-height:160px; overflow-y:auto; margin-bottom:12px;'});
    searchBox.addEventListener('input', function(e){
      var q = e.target.value.trim().toLowerCase();
      resultsBox.innerHTML = '';
      if(q.length < 2) return;
      DATA.filter(function(r){ return r.name.toLowerCase().indexOf(q) !== -1; }).slice(0,8).forEach(function(r){
        resultsBox.appendChild(el('div', {
          style:'padding:6px 8px; cursor:pointer; border-radius:3px;',
          onmouseover:function(e){e.target.style.background='#232326';},
          onmouseout:function(e){e.target.style.background='transparent';},
          onclick:function(){
            picked = r;
            searchBox.value = r.name + (r.email ? '' : '  (no email on file)');
            resultsBox.innerHTML = '';
          }
        }, [r.name + ' — ' + (r.role||'') + (r.email ? '' : '  ⚠ no email')]));
      });
    });
    quickWrap.appendChild(searchBox);
    quickWrap.appendChild(resultsBox);

    var qProject = el('input', {placeholder:'Project name', style:'margin-bottom:8px; width:100%;'});
    var qDates = el('input', {placeholder:'Dates', style:'margin-bottom:8px; width:100%;'});
    var qCompany = selectField('', ['','1stAve','SG','Studio PPS','Mudge'], function(){}, 'Company');
    quickWrap.appendChild(el('div', {class:'form-grid', style:'margin-bottom:10px;'}, [qProject, qDates, qCompany]));
    var qBtnRow = el('div', {style:'display:flex; gap:10px;'}, [
      el('button', {class:'btn btn-primary', onclick:function(){ sendQuick('booking'); }}, ['Draft Booking Email']),
      el('button', {class:'btn', onclick:function(){ sendQuick('hold'); }}, ['Draft Hold Email'])
    ]);
    quickWrap.appendChild(qBtnRow);

    function sendQuick(kind){
      if(!picked){ showToast('Pick a freelancer first.'); return; }
      if(!picked.email){ showToast(picked.name + ' has no email on file.'); return; }
      var tmpl = emailTemplate(kind, picked, {project:qProject.value, dates:qDates.value, company:qCompany.value});
      window.location.href = mailtoLink(picked, tmpl);
    }

    wrap.appendChild(quickWrap);

    // Requests queue
    wrap.appendChild(el('div', {style:'font-weight:700; margin-bottom:10px;'}, ['Requests (' + state.requests.length + ')']));
    if(state.requests.length === 0){
      wrap.appendChild(el('div', {class:'empty-state'}, ['No requests submitted yet.']));
    } else {
      state.requests.forEach(function(req){
        var types = req.requestTypes || (req.requestType === 'both' ? ['booking','availability'] : req.requestType ? [req.requestType] : ['booking']);
        var badgeMap = { booking: ['BOOKING','badge-low'], availability: ['AVAILABILITY','badge-medium'], rate: ['RATE','badge-high'] };
        var badges = types.map(function(t){
          var b = badgeMap[t] || ['REQUEST','badge-free'];
          return el('span', {class:'badge ' + b[1]}, [b[0]]);
        });
        var isHighlighted = state.highlightRequestId && String(req.id) === String(state.highlightRequestId);
        var card = el('div', {class:'req-card' + (isHighlighted ? ' req-card-highlight' : ''), id:'request-' + req.id}, [
          el('div', {class:'req-top'}, [
            el('div', {}, [
              el('div', {style:'font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap;'},
                badges.concat([(req.freelancerName ? req.freelancerName + ' — ' : '') + req.roleNeeded + ' — ' + req.company])
              ),
              el('div', {class:'req-meta'}, [
                'Requested by ' + req.requestor + (req.requestorEmail ? ' ('+req.requestorEmail+')' : '') + '\n' +
                'Project: ' + (req.project || '—') + ' · Dates: ' + (req.dates || '—') + '\n' +
                (req.notes ? 'Notes: ' + req.notes : '')
              ])
            ]),
            el('div', {}, [
              el('button', {class:'btn btn-danger', onclick:function(){
                state.requests = state.requests.filter(function(x){ return x.id !== req.id; });
                saveRequests(state.requests, function(){ render(); });
              }}, ['Dismiss'])
            ])
          ])
        ]);
        wrap.appendChild(card);
      });
    }

    // Internal Team roster
    wrap.appendChild(renderInternalTeamSection());

    return wrap;
  }

  function renderInternalTeamSection(){
    var section = el('div', {style:'margin-top:36px; padding-top:28px; border-top:1px solid #2a2a2e;'});
    section.appendChild(el('div', {class:'section-title'}, ['Internal Team']));
    section.appendChild(el('div', {class:'section-hint'}, [
      'Full-time employees and their project allocations, shown on the Projects tab. ' +
      (state.isAdmin ? 'Add, edit, or remove people below.' : 'Log in as Admin (top right) to add or edit.')
    ]));

    if(state.isAdmin){
      section.appendChild(renderEmployeeForm());
    }

    var companies = ['1stAve','SG','Studio PPS','Mudge'];
    companies.forEach(function(co){
      var emps = state.internalEmployees.filter(function(e){ return e.company === co; });
      if(!emps.length) return;
      section.appendChild(el('div', {style:'font-weight:700; margin:20px 0 10px;'}, [COMPANY_FULLNAME[co] || co]));
      emps.forEach(function(emp){
        var allocText = (emp.allocations||[]).map(function(a){
          return a.project + (a.percentage != null ? ' (' + a.percentage + '%)' : '') + (a.dates ? ' · ' + a.dates : '');
        }).join('\n') || 'No project allocations yet.';
        var card = el('div', {class:'req-card'}, [
          el('div', {class:'req-top'}, [
            el('div', {}, [
              el('div', {style:'font-weight:700;'}, [emp.name + ' — ' + (emp.role || 'Role not set')]),
              el('div', {class:'req-meta'}, [allocText])
            ]),
            state.isAdmin ? el('div', {style:'display:flex; gap:8px;'}, [
              el('button', {class:'btn', onclick:function(){ state.editingEmployeeId = emp.id; render(); }}, ['Edit']),
              el('button', {class:'btn btn-danger', onclick:function(){
                state.internalEmployees = state.internalEmployees.filter(function(x){ return x.id !== emp.id; });
                saveInternalEmployees(state.internalEmployees, function(){ showToast('Removed ' + emp.name + '.'); render(); });
              }}, ['Delete'])
            ]) : null
          ])
        ]);
        section.appendChild(card);
      });
    });

    if(!state.internalEmployees.length){
      section.appendChild(el('div', {class:'empty-state'}, ['No internal employees added yet.']));
    }

    return section;
  }

  function renderEmployeeForm(){
    var editing = state.editingEmployeeId ? state.internalEmployees.find(function(e){ return e.id === state.editingEmployeeId; }) : null;
    var panel = el('div', {class:'panel', style:'margin-bottom:24px;'});
    panel.appendChild(el('div', {style:'font-weight:700; margin-bottom:12px;'}, [editing ? ('Editing ' + editing.name) : 'Add Employee']));

    var nameInput = el('input', {type:'text', value: editing ? editing.name : ''});
    var roleInput = el('input', {type:'text', value: editing ? (editing.role||'') : ''});
    var companySelect = selectFormField('Company', ['1stAve','SG','Studio PPS','Mudge'], function(){}, editing ? editing.company : '1stAve');

    panel.appendChild(el('div', {class:'form-grid'}, [
      el('div', {class:'form-field'}, [el('label',{},['Name']), nameInput]),
      el('div', {class:'form-field'}, [el('label',{},['Role']), roleInput]),
      companySelect
    ]));

    var allocContainer = el('div', {style:'margin-top:14px;'}, []);
    var allocRows = [];

    function getActiveProjectNames(){
      var names = {};
      DATA.forEach(function(r){ if(isBooked(r) && r.currentProject) names[r.currentProject] = true; });
      state.internalEmployees.forEach(function(emp){
        (emp.allocations || []).forEach(function(a){ if(a.project) names[a.project] = true; });
      });
      return Object.keys(names).sort();
    }
    var activeProjects = getActiveProjectNames();

    function addAllocRow(prefill){
      prefill = prefill || {};
      var isKnownProject = prefill.project && activeProjects.indexOf(prefill.project) !== -1;

      var projectSelect = el('select', {});
      projectSelect.appendChild(el('option', {value:''}, ['Select a project…']));
      activeProjects.forEach(function(name){
        var opt = el('option', {value:name}, [name]);
        if(prefill.project === name) opt.selected = true;
        projectSelect.appendChild(opt);
      });
      var newOpt = el('option', {value:'__new__'}, ['+ Add New Project']);
      if(prefill.project && !isKnownProject) newOpt.selected = true;
      projectSelect.appendChild(newOpt);

      var newProjectInput = el('input', {
        type:'text', placeholder:'New project name',
        style:'margin-top:6px; display:' + ((prefill.project && !isKnownProject) ? 'block' : 'none') + ';',
        value: (prefill.project && !isKnownProject) ? prefill.project : ''
      });

      projectSelect.addEventListener('change', function(e){
        newProjectInput.style.display = e.target.value === '__new__' ? 'block' : 'none';
      });

      var pctInput = el('input', {type:'number', placeholder:'% capacity', min:'0', max:'100', value: prefill.percentage != null ? prefill.percentage : ''});
      var datesInput = el('input', {type:'text', placeholder:'Dates (e.g. Aug 1 – Sep 30)', value: prefill.dates || ''});
      var rowObj = {projectSelect:projectSelect, newProjectInput:newProjectInput, pctInput:pctInput, datesInput:datesInput};
      var removeBtn = el('button', {class:'btn btn-danger', onclick:function(){
        allocContainer.removeChild(rowObj.rowEl);
        allocRows = allocRows.filter(function(r){ return r !== rowObj; });
      }}, ['Remove']);
      var rowEl = el('div', {class:'form-grid', style:'grid-template-columns:2fr 1fr 2fr auto; gap:8px; margin-bottom:8px; align-items:end;'}, [
        el('div', {class:'form-field'}, [el('label',{},['Project']), projectSelect, newProjectInput]),
        el('div', {class:'form-field'}, [el('label',{},['Capacity %']), pctInput]),
        el('div', {class:'form-field'}, [el('label',{},['Dates']), datesInput]),
        removeBtn
      ]);
      rowObj.rowEl = rowEl;
      allocRows.push(rowObj);
      allocContainer.appendChild(rowEl);
    }

    if(editing && editing.allocations && editing.allocations.length){
      editing.allocations.forEach(function(a){ addAllocRow(a); });
    } else {
      addAllocRow();
    }

    panel.appendChild(el('div', {style:'font-family:IBM Plex Mono,monospace; font-size:13.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-top:10px; margin-bottom:8px;'}, ['Project Allocations']));
    panel.appendChild(allocContainer);
    panel.appendChild(el('button', {class:'btn', style:'margin-bottom:16px;', onclick:function(){ addAllocRow(); }}, ['+ Add Another Project']));

    var btnRow = el('div', {style:'display:flex; gap:10px;'}, [
      el('button', {class:'btn btn-primary', onclick:function(){
        var name = nameInput.value.trim();
        var role = roleInput.value.trim();
        var company = companySelect.querySelector('select').value;
        if(!name){ showToast('Please add a name.'); return; }
        var allocations = allocRows.map(function(r){
          var projectName = r.projectSelect.value === '__new__' ? r.newProjectInput.value.trim() : r.projectSelect.value;
          return {
            project: projectName,
            percentage: r.pctInput.value !== '' ? Number(r.pctInput.value) : null,
            dates: r.datesInput.value.trim()
          };
        }).filter(function(a){ return a.project; });

        if(editing){
          editing.name = name; editing.role = role; editing.company = company; editing.allocations = allocations;
        } else {
          state.internalEmployees.push({ id: 'emp_' + Date.now(), name: name, role: role, company: company, allocations: allocations });
        }
        state.editingEmployeeId = null;
        saveInternalEmployees(state.internalEmployees, function(){
          showToast(editing ? 'Updated ' + name + '.' : 'Added ' + name + '.');
          render();
        });
      }}, [editing ? 'Save Changes' : 'Add Employee'])
    ]);
    if(editing){
      btnRow.appendChild(el('button', {class:'btn', onclick:function(){ state.editingEmployeeId = null; render(); }}, ['Cancel']));
    }
    panel.appendChild(btnRow);

    return panel;
  }

  /* ---------------- render: modal ---------------- */
  function renderModal(){
    if(!state.modalPerson) return null;
    var r = state.modalPerson;
    var portfolioUrl = r.portfolio ? r.portfolio.replace(/^.*?-\s*/, '') : null;
    var overlay = el('div', {class:'modal-overlay', onclick:function(e){ if(e.target === overlay){ state.modalPerson=null; render(); } }});
    var modal = el('div', {class:'modal'}, [
      el('button', {class:'modal-close', onclick:function(){ state.modalPerson=null; render(); }}, ['✕']),
      r.trusted ? el('div', {class:'trusted-tag', style:'position:static; display:inline-block; margin-bottom:8px;'}, ['Trusted Freelancer']) : null,
      el('h2', {}, [r.name]),
      el('div', {class:'role-line'}, [r.role || 'Role not set']),

      el('div', {class:'modal-section'}, [
        el('h4', {}, ['Status']),
        el('p', {}, [
          r.company ? ('Booked on ' + (r.currentProject||'—') + ' with ' + r.company + (r.bookedDates ? ' · ' + formatDateRange(r.bookedDates) : '') + (r.allocation ? ' · ' + r.allocation + ' allocation' : '')) : 'Not currently booked.'
        ]),
        r.bookedDates2 ? el('p', {style:'margin-top:6px;color:var(--muted);'}, ['Second booking window: ' + formatDateRange(r.bookedDates2)]) : null,
        r.currentHold ? el('p', {style:'margin-top:6px;color:var(--muted);'}, ['On hold for ' + r.currentHold + (r.holdDates ? ' · ' + formatDateRange(r.holdDates) : '')]) : null
      ]),

      (r.location || (state.isAdmin && r.rate) || r.email) ? el('div', {class:'modal-section'}, [
        el('h4', {}, ['Details']),
        el('p', {}, [
          (r.location ? 'Based in ' + r.location + '\n' : '') +
          (state.isAdmin && r.rate ? 'Preferred rate: ' + r.rate + (r.ratePer?'/'+r.ratePer:'') + '\n' : '') +
          (r.email ? 'Email: ' + r.email : '')
        ])
      ]) : null,

      r.aiSummary ? el('div', {class:'modal-section'}, [el('h4',{},['Summary']), el('p',{},[r.aiSummary])]) : null,
      r.work ? el('div', {class:'modal-section'}, [el('h4',{},['Past Work']), el('p',{},[r.work])]) : null,
      r.industries ? el('div', {class:'modal-section'}, [el('h4',{},['Industries']), el('div',{class:'chip-row'}, r.industries.split(',').map(function(s){return el('span',{class:'chip'},[s.trim()]);}))]) : null,
      skillList(r).length ? el('div', {class:'modal-section'}, [el('h4',{},['Skills']), el('div',{class:'chip-row'}, skillList(r).map(function(s){return el('span',{class:'chip'},[s]);}))]) : null,
      r.duoPartner ? el('div', {class:'modal-section'}, [el('h4',{},['Pairs well with']), el('p',{},[r.duoPartner])]) : null,
      (state.isAdmin && r.notes) ? el('div', {class:'modal-section'}, [el('h4',{},['Notes']), el('p',{},[r.notes])]) : null,
      r.availability ? el('div', {class:'modal-section'}, [el('h4',{},['Availability']), el('p',{},[r.availability])]) : null,

      el('div', {class:'link-row'}, [
        portfolioUrl ? el('a', {href:portfolioUrl, target:'_blank'}, ['Portfolio ↗']) : null,
        r.linkedin ? el('a', {href:r.linkedin, target:'_blank'}, ['LinkedIn ↗']) : null,
        r.resume ? el('a', {href:r.resume, target:'_blank'}, ['Resume ↗']) : null
      ]),

      el('div', {class:'modal-actions'}, [
        el('button', {class:'heart-btn-inline' + (state.favorites.indexOf(r.id)!==-1?' active':''), onclick:function(){
          toggleFavorite(r.id);
          state.modalPerson = r;
        }}, [(state.favorites.indexOf(r.id)!==-1 ? '♥ Favorited' : '♡ Add to My Favorites')])
      ])
    ]);
    overlay.appendChild(modal);
    return overlay;
  }

  /* ---------------- main render ---------------- */
  function render(){
    var root = document.getElementById('root');
    root.innerHTML = '';
    root.appendChild(renderHeader());
    var wrap = el('div', {class:'wrap'});
    if(state.tab === 'directory') wrap.appendChild(renderDirectory());
    else if(state.tab === 'projects') wrap.appendChild(renderProjects());
    else if(state.tab === 'reuse') wrap.appendChild(renderReuseOpportunities());
    else if(state.tab === 'capacity') wrap.appendChild(state.isAdmin ? renderCapacity() : el('div', {class:'empty-state'}, ['You need admin access to view Team Capacity. Ask whoever manages the ADMIN_EMAILS_* settings to add your email.']));
    else if(state.tab === 'favorites') wrap.appendChild(renderFavorites());
    else if(state.tab === 'request') wrap.appendChild(renderRequestForm());
    else if(state.tab === 'admin') wrap.appendChild(state.isAdmin ? renderAdmin() : el('div', {class:'empty-state'}, ['You need admin access to view this page. Ask whoever manages the ADMIN_EMAILS_* settings to add your email.']));
    root.appendChild(wrap);
    var modal = renderModal();
    if(modal) root.appendChild(modal);
    var empModal = renderEmployeeModal();
    if(empModal) root.appendChild(empModal);
    if(state.toast) root.appendChild(el('div', {class:'toast'}, [state.toast]));
  }

  function loadEverythingAndRender(){
    loadRequests(function(reqs){
      state.requests = reqs;
      loadFavorites(function(favs){
        state.favorites = favs;
        loadInternalEmployees(function(emps){
          state.internalEmployees = emps;
          loadManualAssignments(function(assigns){
            state.manualAssignments = assigns;
            loadProfile(function(profile){
              state.profile = profile && (profile.name || profile.email)
                ? profile
                : { name: (window.Clerk.user && window.Clerk.user.fullName) || '', email: state.userEmail || '' };
              applyRequestDeepLink();
              render();
            });
          });
        });
      });
    });
  }

  // Handles links like yoursite.netlify.app/?requestId=12345 (sent in the
  // "Talent Request" email alert) by jumping straight to the Admin tab and
  // scrolling to/highlighting that specific request, instead of just landing
  // on the homepage and making the person hunt for it.
  function applyRequestDeepLink(){
    var params = new URLSearchParams(window.location.search);
    var requestId = params.get('requestId');
    if(!requestId) return;
    if(!state.isAdmin){
      showToast('That link opens a specific request, but you need admin access to view it.');
      return;
    }
    state.tab = 'admin';
    state.highlightRequestId = requestId;
    setTimeout(function(){
      var el = document.getElementById('request-' + requestId);
      if(el){
        el.scrollIntoView({behavior:'smooth', block:'center'});
      }
    }, 150);
  }

  function fetchFreelancerData(cb){
    fetch('/.netlify/functions/get-freelancers')
      .then(function(res){ return res.json(); })
      .then(function(json){
        DATA = json.items || [];
        freelancerDataUpdatedAt = json.updatedAt || null;
        cb();
      })
      .catch(function(){ DATA = []; cb(); });
  }

  function fetchCapacityData(cb){
    // Only admins can see Team Capacity, and only admins are allowed to call
    // this endpoint (enforced server-side in get-capacity.mjs too) — skip the
    // call entirely for everyone else so non-admins never even request it.
    if(!state.isAdmin){ CAPACITY_DATA = []; cb(); return; }
    fetch('/.netlify/functions/get-capacity', { headers: { 'Authorization': 'Bearer ' + clerkToken } })
      .then(function(res){ return res.json(); })
      .then(function(json){
        CAPACITY_DATA = json.items || [];
        capacityDataUpdatedAt = json.updatedAt || null;
        cb();
      })
      .catch(function(){ CAPACITY_DATA = []; cb(); });
  }

  function startApp(){
    document.getElementById('signin-gate').style.display = 'none';
    document.getElementById('root').style.display = '';
    fetchFreelancerData(function(){ fetchCapacityData(loadEverythingAndRender); });
  }

  // --- Clerk boot sequence ---
  window.addEventListener('load', function(){
    if(!window.Clerk){
      document.getElementById('clerk-signin-container').textContent =
        'Could not load Clerk. Check your publishable key and network connection.';
      return;
    }
    window.Clerk.load().then(function(){
      if(window.Clerk.user){
        window.Clerk.session.getToken().then(function(token){
          clerkToken = token;
          var email = window.Clerk.user.primaryEmailAddress ? window.Clerk.user.primaryEmailAddress.emailAddress : '';
          state.userEmail = email;
          fetch('/.netlify/functions/me', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(function(res){ return res.ok ? res.json() : { isAdmin:false, adminCompanies:[] }; })
            .then(function(me){
              state.isAdmin = !!me.isAdmin;
              state.adminCompanies = me.adminCompanies || [];
              startApp();
            });
        });
      } else {
        window.Clerk.mountSignIn(document.getElementById('clerk-signin-container'));
        window.Clerk.addListener(function(payload){
          if(payload.user){ window.location.reload(); }
        });
      }
    });
  });
})();
</script>
</body>

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled syncs (Golden Rolodex + Team Capacity) run at 8:00 AM and 4:00 PM
# Pacific Standard Time, Monday through Friday. The actual schedules are
# defined inside sync-monday-am.mjs, sync-monday-pm.mjs, sync-capacity-am.mjs,
# and sync-capacity-pm.mjs (via each file's own `export const config`), not
# here — Netlify picks those up automatically, no config needed in this file
# for them.
#
# sync-monday.mjs and sync-capacity.mjs themselves are no longer scheduled —
# they're now admin-only manual triggers, called by the "Sync Now" button in
# the Admin tab.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
